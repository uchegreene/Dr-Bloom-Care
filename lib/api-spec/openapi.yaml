openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bloom account, plan, and care-advice API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bloom
    description: Bloom membership and care advice
paths:
  /daily-tips:
    get:
      operationId: listDailyTips
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Published AI education for the member's active paid plan
      responses:
        "200":
          description: Medically approved published tips
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DailyTip" } }
  /daily-tips/notices:
    get:
      operationId: listDailyTipNotices
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: This member's published-tip notices
      responses:
        "200":
          description: Notices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DailyTipNotice" } }
  /daily-tips/notices/read:
    post:
      operationId: readDailyTipNotices
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Mark this member's notices as read
      responses:
        "204": { description: Marked read }
  /daily-tips/devices:
    get:
      operationId: listDailyTipDevices
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: This account's notification device preferences
      responses:
        "200":
          description: Devices without private push tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DailyTipDevice" } }
    put:
      operationId: setDailyTipDevice
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Opt this device into or out of daily-tip phone notifications
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyTipDeviceInput" }
      responses:
        "200":
          description: Device preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTipDevice" }
  /daily-tips/devices/{deviceId}:
    delete:
      operationId: removeDailyTipDevice
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Remove this account's device at sign-out
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Device removed }
  /daily-tips/review:
    get:
      operationId: listDailyTipDrafts
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Medical team review queue and recent publications
      responses:
        "200":
          description: Drafts and recent publications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DailyTip" } }
  /daily-tips/review/generate:
    post:
      operationId: generateDailyTipDrafts
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Queue missing drafts without overwriting reviewed content
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyTipQueueInput" }
      responses:
        "202":
          description: Drafts queued for the background worker
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer }
  /daily-tips/review/{id}:
    patch:
      operationId: reviewDailyTip
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Edit, approve, reject or retry an AI draft
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyTipReviewInput" }
      responses:
        "200":
          description: Updated tip; editing clears prior approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTip" }
  /daily-tips/review/settings:
    get:
      operationId: getDailyTipStatus
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Worker settings and current reviewer access
      responses:
        "200":
          description: Scheduling and review access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTipStatus" }
    put:
      operationId: setDailyTipStatus
      security: [{ bearerAuth: [] }]
      tags: [bloom]
      summary: Super administrator can pause or resume automation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyTipStatusInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTipStatus" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account:
    get:
      operationId: getAccount
      tags: [bloom]
      summary: Get the signed-in member account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAccount"
    put:
      operationId: updateAccount
      tags: [bloom]
      summary: Create or update the signed-in member profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated member account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAccount"
        "409":
          description: Username is already taken
  /plans:
    get:
      operationId: listPlans
      tags: [bloom]
      summary: Get current cycle and pregnancy plan fees
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current plan fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanPricing"
  /subscription-request:
    post:
      operationId: requestSubscription
      deprecated: true
      tags: [bloom]
      summary: Retired manual payment request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequestInput"
      responses:
        "503":
          description: Manual requests are retired; verified subscription billing must be connected
  /advisors:
    get:
      operationId: listAdvisors
      tags: [bloom]
      summary: List active verified care advisors
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Care advisors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advisor"
  /advice:
    get:
      operationId: listAdvice
      tags: [bloom]
      summary: Read advice published by verified advisors
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Advice articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdvicePost"
  /admin/staff-accounts:
    post:
      operationId: createStaffAccount
      tags: [bloom]
      summary: Super administrator creates a staff account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountInput"
      responses:
        "201":
          description: Staff account created; use email password recovery to choose a password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccountResult"
        "403":
          description: Super administrator required
        "409":
          description: Account or professional assignment already exists
  /admin/assignments:
    get:
      operationId: listAdminAssignments
      tags: [bloom]
      summary: Super administrator lists delegated administrator access
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrator assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAssignment"
        "403":
          description: Super administrator required
  /admin/assignments/{userId}:
    put:
      operationId: setAdminAssignment
      tags: [bloom]
      summary: Super administrator grants or revokes administrator access
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAssignmentInput"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignment"
        "403":
          description: Super administrator required
        "404":
          description: Registered member not found
        "409":
          description: Unverified target or protected super administrator
  /admin/members:
    get:
      operationId: listAdminMembers
      tags: [bloom]
      summary: List accounts for manual subscription approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMember"
        "403":
          description: Administrator access required
  /admin/plans/{plan}:
    put:
      operationId: updatePlanPrice
      tags: [bloom]
      summary: Change a plan fee
      security:
        - bearerAuth: []
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            enum: [cycle, pregnancy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanPriceInput"
      responses:
        "200":
          description: Updated plan fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPricing"
        "403":
          description: Administrator access required
  /admin/advisors:
    get:
      operationId: listAdminAdvisors
      tags: [bloom]
      summary: List all care advisor profiles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Care advisor profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advisor"
    post:
      operationId: createAdvisor
      tags: [bloom]
      summary: Add a verified care advisor profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisorInput"
      responses:
        "201":
          description: Created verified advisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisor"
        "403":
          description: Administrator access required
  /admin/advice:
    post:
      operationId: createAdvice
      tags: [bloom]
      summary: Publish advice under an approved advisor profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceInput"
      responses:
        "201":
          description: Published advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvicePost"
        "403":
          description: Administrator access required
  /admin/members/{userId}/subscription:
    post:
      operationId: grantMembership
      deprecated: true
      tags: [bloom]
      summary: Retired administrator subscription activation
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipGrantInput"
      responses:
        "409":
          description: Paid access requires verified billing, not administrator approval
        "403":
          description: Administrator access required
  /community/posts:
    get:
      operationId: listCommunityPosts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Shared community posts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommunityPost" } }
    post:
      operationId: createCommunityPost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityPostInput" }
      responses:
        "201":
          description: Published post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
  /community/posts/{id}:
    get:
      operationId: getCommunityPost
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Post with comments and tagged professionals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
  /community/posts/{id}/comments:
    post:
      operationId: createCommunityComment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityCommentInput" }
      responses:
        "201":
          description: Comment or verified professional reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
  /community/posts/{id}/like:
    post:
      operationId: toggleCommunityLike
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
  /community/uploads:
    post:
      operationId: requestCommunityUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityUploadInput" }
      responses:
        "201":
          description: Private photo upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityUpload" }
  /medical/questions:
    get:
      operationId: listMedicalQuestions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Posts tagging medical profiles, visible to the medical team
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommunityPost" } }
  /medical/advice:
    post:
      operationId: publishMedicalAdvice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdviceInput" }
      responses:
        "201":
          description: Advice from the responding professional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvicePost" }
  /medical/conversations:
    get:
      operationId: listMedicalConversations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Member's own private threads, or the authorized shared team inbox
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MedicalConversation" } }
    post:
      operationId: startMedicalConversation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalConversationInput" }
      responses:
        "201":
          description: Private discussion opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalConversation" }
  /medical/conversations/{id}/messages:
    get:
      operationId: listMedicalMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Private thread messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MedicalMessage" } }
    post:
      operationId: sendMedicalMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalMessageInput" }
      responses:
        "201":
          description: Message delivered to the private team thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalMessage" }
  /admin/medical-team:
    get:
      operationId: listMedicalTeam
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authorized professional accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MedicalTeamMember" } }
    post:
      operationId: assignMedicalTeamMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalTeamAssignment" }
      responses:
        "200":
          description: Professional account linked to verified profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalTeamMember" }
  /admin/medical-team/{userId}:
    delete:
      operationId: revokeMedicalTeamMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Team access revoked
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    StaffAccountInput:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 2, maxLength: 120 }
        role: { type: string, enum: [admin, medical_team] }
        advisorId: { type: integer, minimum: 1 }
    StaffAccountResult:
      type: object
      required: [userId, email, role]
      properties:
        userId: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, medical_team] }
    AdminAssignmentInput:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    AdminAssignment:
      type: object
      required: [userId, email, active, assignedBy, assignedAt, updatedBy, updatedAt]
      properties:
        userId: { type: string }
        email: { type: string }
        active: { type: boolean }
        assignedBy: { type: string }
        assignedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    DailyTipDeviceInput:
      type: object
      required: [deviceId, enabled]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        token: { type: string, maxLength: 256 }
    DailyTipQueueInput:
      type: object
      required: [days]
      properties:
        days: { type: integer, minimum: 1, maximum: 7 }
    DailyTipReviewInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [edit, approve, reject, retry] }
        title: { type: string, minLength: 1, maxLength: 180 }
        body: { type: string, minLength: 1, maxLength: 5000 }
    DailyTipStatusInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    DailyTip:
      type: object
      required: [id, date, audience, status, title, body, model, reviewerName, reviewedAt, publishedAt, error]
      properties:
        id: { type: integer }
        date: { type: string }
        audience: { type: string, enum: [cycle, pregnancy] }
        status: { type: string, enum: [queued, generating, draft, approved, rejected, published, error] }
        title: { type: string }
        body: { type: string }
        model: { type: string }
        reviewerName: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
    DailyTipNotice:
      type: object
      required: [id, tip, readAt, createdAt]
      properties:
        id: { type: integer }
        tip: { $ref: "#/components/schemas/DailyTip" }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    DailyTipDevice:
      type: object
      required: [id, enabled]
      properties:
        id: { type: string }
        enabled: { type: boolean }
    DailyTipStatus:
      type: object
      required: [enabled, isAdmin, canApprove, schedule, provider]
      properties:
        enabled: { type: boolean }
        isAdmin: { type: boolean }
        canApprove: { type: boolean }
        schedule: { type: string }
        provider: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    MemberAccount:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        username: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        bio: { type: string }
        femaleOnlyConfirmed: { type: boolean }
        mode: { type: string, enum: [cycle, pregnant, none] }
        role: { type: string, enum: [member, admin, medical_team] }
        isSuperAdmin: { type: boolean }
        advisorId: { type: ["integer", "null"] }
        subscriptionPlan: { type: ["string", "null"], enum: [cycle, pregnancy, null] }
        subscriptionStatus: { type: string, enum: [free, active, expired] }
        subscriptionExpiresAt: { type: ["string", "null"], format: date-time }
        requestedPlan: { type: ["string", "null"], enum: [cycle, pregnancy, null] }
        requestedAt: { type: ["string", "null"], format: date-time }
        subscriptionActive: { type: boolean }
        profileComplete: { type: boolean }
      required:
        - userId
        - email
        - username
        - name
        - dateOfBirth
        - bio
        - femaleOnlyConfirmed
        - mode
        - role
        - advisorId
        - subscriptionPlan
        - subscriptionStatus
        - subscriptionExpiresAt
        - requestedPlan
        - requestedAt
        - subscriptionActive
        - profileComplete
    AccountInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[A-Za-z0-9_]+$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        bio: { type: string, maxLength: 280 }
        femaleOnlyConfirmed: { type: boolean }
        mode: { type: string, enum: [cycle, pregnant, none] }
      required: [username, name, dateOfBirth, bio, femaleOnlyConfirmed, mode]
    PlanPricing:
      type: object
      properties:
        plan: { type: string, enum: [cycle, pregnancy] }
        priceNaira: { type: integer, minimum: 0 }
      required: [plan, priceNaira]
    PlanPriceInput:
      type: object
      properties:
        priceNaira: { type: integer, minimum: 0, maximum: 100000000 }
      required: [priceNaira]
    SubscriptionRequestInput:
      type: object
      properties:
        plan: { type: string, enum: [cycle, pregnancy] }
      required: [plan]
    SubscriptionRequest:
      type: object
      properties:
        requestedPlan: { type: string, enum: [cycle, pregnancy] }
        requestedAt: { type: string, format: date-time }
      required: [requestedPlan, requestedAt]
    Advisor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        title: { type: string }
        specialty: { type: string }
        credentials: { type: string }
        bio: { type: string }
        isVerified: { type: boolean }
        isActive: { type: boolean }
      required: [id, name, title, specialty, credentials, bio, isVerified, isActive]
    AdvisorInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        title: { type: string, minLength: 2, maxLength: 100 }
        specialty: { type: string, minLength: 2, maxLength: 100 }
        credentials: { type: string, minLength: 2, maxLength: 160 }
        bio: { type: string, minLength: 10, maxLength: 1200 }
        credentialsVerified: { type: boolean }
      required: [name, title, specialty, credentials, bio, credentialsVerified]
    AdvicePost:
      type: object
      properties:
        id: { type: integer }
        advisorId: { type: integer }
        authorName: { type: string }
        title: { type: string }
        body: { type: string }
